<!-- App Root Container with Single Router Outlet -->
<div class="app-container" [class.auth-mode]="isLoginPage()">
  <!-- Left Navigation Sidebar (Hidden on Login page) -->
  <app-sidebar *ngIf="!isLoginPage()"></app-sidebar>

  <!-- Main Content Area -->
  <div class="main-content-wrapper">
    <!-- Header Bar (Hidden on Login page) -->
    <app-header *ngIf="!isLoginPage()"></app-header>

    <!-- Single Persistent Router Outlet -->
    <router-outlet></router-outlet>
  </div>
</div>
